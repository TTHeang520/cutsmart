name: Windows package
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt PyInstaller==6.22.0
      - run: ./scripts/build-windows.ps1 -Python (Get-Command python).Source
      - run: python scripts/test-package.py release/CutSmart/CutSmart.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CutSmart-Windows-x64
          path: release/CutSmart-Windows-x64.zip
